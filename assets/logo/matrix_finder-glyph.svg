<svg xmlns="http://www.w3.org/2000/svg" width="764" height="764" viewBox="130 174 764 764">
  <!-- The folder alone (no tile), for the app menu and the About window. -->
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8a5a00" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ac22"/>
      <stop offset="1" stop-color="#d98a08"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="0.5" stop-color="#ffc83a"/>
      <stop offset="1" stop-color="#f6ab1c"/>
    </linearGradient>
  </defs>
  <g filter="url(#soft)">
    <!-- folder back with its tab -->
    <path d="M178 330 q0 -62 62 -62 h150 q34 0 56 26 l30 36 q16 18 42 18 h226 q62 0 62 62 v40 h-628 Z" fill="url(#back)"/>
    <!-- folder front -->
    <rect x="150" y="392" width="724" height="452" rx="68" fill="url(#front)"/>
  </g>
  <rect x="152" y="394" width="720" height="448" rx="66" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
  <!-- the identity matrix [ 1 0 0 / 0 1 0 / 0 0 1 ] -->
  <g fill="none" stroke="#7a4a00" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M318 472 h-40 v306 h40"/>
    <path d="M706 472 h40 v306 h-40"/>
  </g>
  <g>
      <rect x="368" y="482" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.88"/>
      <rect x="474" y="482" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.2"/>
      <rect x="580" y="482" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.2"/>
      <rect x="368" y="587" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.2"/>
      <rect x="474" y="587" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.88"/>
      <rect x="580" y="587" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.2"/>
      <rect x="368" y="692" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.2"/>
      <rect x="474" y="692" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.2"/>
      <rect x="580" y="692" width="76" height="76" rx="20" fill="#7a4a00" opacity="0.88"/>
  </g>
</svg>
