[package]
name = "matrix_finder"
description = "Matrix Finder: a cross-platform dual-panel file manager"
license = "MIT"
version = "0.17.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
# The OpenGL (glow) renderer the app has always used; eframe 0.34 made wgpu the default.
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "qoi", "pnm", "dds", "exr", "hdr"] }
resvg = "0.45"
# Already in the tree via resvg/fontdb and ab_glyph; reads system fonts for glyph fallback.
ttf-parser = "0.25"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Already in the tree (through url); websites typed with accents match their links.
idna = "1.1"
# eframe's default features (off above) turned on winit's: X11 and Wayland, Wayland window
# decorations, libwayland loaded at run time.
winit = "0.30"
walkdir = "2"
chrono = "0.4"
open = "5"
zip = { version = "9.6", default-features = false, features = ["deflate", "aes-crypto"] }
sevenz-rust2 = { version = "0.24", features = ["compress"] }
unrar = "0.5"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = { version = "0.13", features = ["zstdmt"] }
bzip2 = "0.5"
suppaftp = "13"
ssh2 = { version = "0.9", optional = true }
sysinfo = "0.33"
globset = "0.4"
rfd = "0.15"
trash = "5"
egui_extras = { version = "0.35", default-features = false }
parquet = { version = "59", default-features = false, features = ["snap", "brotli", "flate2-zlib-rs", "lz4", "zstd"] }
apache-avro = { version = "0.21", features = ["snappy", "zstandard", "bzip"] }
calamine = { version = "0.38", features = ["dates"] }
csv = "1"
hayro = "0.9"
base64 = "0.22"
bytes = "1"
regex = "1"
unicode-normalization = "0.1"
alacritty_terminal = "0.26"
arboard = { version = "3", default-features = false }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
blake3 = "1"
wuff = "0.2.10"
x509-parser = "0.18.1"
hdf5-pure = "0.13.0"
rusqlite = { version = "0.43", features = ["bundled", "hooks", "column_decltype"] }
arrow-ipc = { version = "59", features = ["lz4", "zstd"] }
arrow-array = "59"
arrow-cast = "59"
quick-xml = "0.41.0"
encoding_rs = "0.8.35"
lofty = "0.24.0"
snap = "1.1.2"
lz4_flex = "0.14.0"

[features]
default = ["sftp"]
sftp = ["dep:ssh2"]
vendored-openssl = ["ssh2?/vendored-openssl"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Linux packages (scripts/linux/build-packages.sh, `make deb` / `make rpm`): the same
# files scripts/install.sh puts in ~/.local, under /usr. The window loads the graphics,
# X11 and Wayland libraries at run time, so they are listed by hand; `$auto` (deb) and
# the rpm's automatic requirements add the linked ones (OpenSSL 3, libstdc++, glibc).
[package.metadata.deb]
name = "matrix-finder"
maintainer = "Tien Le-Quang <quangtiencs@gmail.com>"
copyright = "Tien Le-Quang"
extended-description = "A dual-panel file manager with tabs, a built-in terminal, archives and FTP/SFTP browsed like folders, and Quick View for documents, data and media files."
section = "utils"
priority = "optional"
depends = "$auto, libegl1, libgl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrender1, libxcb1, libwayland-client0, libwayland-egl1, libxkbcommon0, libxkbcommon-x11-0"
recommends = "xdg-utils, xdg-desktop-portal"
suggests = "git, ffmpeg"
maintainer-scripts = "scripts/linux/deb/"
license-file = ["LICENSE", "0"]
assets = [
    ["target/release/matrix_finder", "usr/bin/", "755"],
    ["THIRD-PARTY-LICENSES.md", "usr/share/doc/matrix-finder/", "644"],
    ["assets/linux/org.matrixfinder.MatrixFinder.desktop", "usr/share/applications/", "644"],
    ["assets/logo/matrix_finder-small-16.png", "usr/share/icons/hicolor/16x16/apps/org.matrixfinder.MatrixFinder.png", "644"],
    ["assets/logo/matrix_finder-small-32.png", "usr/share/icons/hicolor/32x32/apps/org.matrixfinder.MatrixFinder.png", "644"],
    ["assets/logo/matrix_finder-64.png", "usr/share/icons/hicolor/64x64/apps/org.matrixfinder.MatrixFinder.png", "644"],
    ["assets/logo/matrix_finder-256.png", "usr/share/icons/hicolor/256x256/apps/org.matrixfinder.MatrixFinder.png", "644"],
    ["assets/logo/matrix_finder-512.png", "usr/share/icons/hicolor/512x512/apps/org.matrixfinder.MatrixFinder.png", "644"],
    ["assets/logo/matrix_finder.svg", "usr/share/icons/hicolor/scalable/apps/org.matrixfinder.MatrixFinder.svg", "644"],
]

[package.metadata.generate-rpm]
name = "matrix-finder"
summary = "Dual-panel file manager with tabs, a terminal and previews"
url = "https://github.com/quangtiencs/matrix_finder"
post_install_script = "scripts/linux/deb/postinst"
assets = [
    { source = "target/release/matrix_finder", dest = "/usr/bin/matrix_finder", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/matrix-finder/LICENSE", mode = "644", doc = true },
    { source = "THIRD-PARTY-LICENSES.md", dest = "/usr/share/licenses/matrix-finder/THIRD-PARTY-LICENSES.md", mode = "644", doc = true },
    { source = "assets/linux/org.matrixfinder.MatrixFinder.desktop", dest = "/usr/share/applications/org.matrixfinder.MatrixFinder.desktop", mode = "644" },
    { source = "assets/logo/matrix_finder-small-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/org.matrixfinder.MatrixFinder.png", mode = "644" },
    { source = "assets/logo/matrix_finder-small-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/org.matrixfinder.MatrixFinder.png", mode = "644" },
    { source = "assets/logo/matrix_finder-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/org.matrixfinder.MatrixFinder.png", mode = "644" },
    { source = "assets/logo/matrix_finder-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/org.matrixfinder.MatrixFinder.png", mode = "644" },
    { source = "assets/logo/matrix_finder-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/org.matrixfinder.MatrixFinder.png", mode = "644" },
    { source = "assets/logo/matrix_finder.svg", dest = "/usr/share/icons/hicolor/scalable/apps/org.matrixfinder.MatrixFinder.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrender.so.1()(64bit)" = "*"
"libxcb.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
xdg-utils = "*"
xdg-desktop-portal = "*"

[package.metadata.generate-rpm.suggests]
git = "*"
ffmpeg = "*"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "eframe"] }
rust_xlsxwriter = "0.102"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Startup notification on Wayland (src/system/activation.rs): the same crates winit uses.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
