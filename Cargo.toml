[package]
name = "matrix_finder"
description = "Matrix Finder: a cross-platform dual-panel file manager"
license = "MIT"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = "0.45"
# Already in the tree via resvg/fontdb and ab_glyph; reads system fonts for glyph fallback.
ttf-parser = "0.25"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
chrono = "0.4"
open = "5"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
sevenz-rust2 = { version = "0.24", features = ["compress"] }
unrar = "0.5"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = { version = "0.13", features = ["zstdmt"] }
bzip2 = "0.5"
suppaftp = "6"
ssh2 = { version = "0.9", optional = true }
sysinfo = "0.33"
globset = "0.4"
rfd = "0.15"
trash = "5"
egui_extras = { version = "0.31", default-features = false }
parquet = { version = "59", default-features = false, features = ["snap", "brotli", "flate2-zlib-rs", "lz4", "zstd"] }
apache-avro = { version = "0.21", features = ["snappy", "zstandard", "bzip"] }
calamine = { version = "0.35", features = ["dates"] }
csv = "1"
hayro = "0.9"
base64 = "0.22"
bytes = "1"
regex = "1"
unicode-normalization = "0.1"
alacritty_terminal = "0.26"
arboard = { version = "3", default-features = false }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
blake3 = "1"
wuff = "0.2.10"
x509-parser = "0.18.1"
hdf5-pure = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "column_decltype"] }
arrow-ipc = { version = "59", features = ["lz4", "zstd"] }
arrow-array = "59"
arrow-cast = "59"
quick-xml = "0.41.0"
encoding_rs = "0.8.35"

[features]
default = ["sftp"]
sftp = ["dep:ssh2"]
vendored-openssl = ["ssh2?/vendored-openssl"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "eframe"] }
rust_xlsxwriter = "0.89"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
